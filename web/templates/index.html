<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PYCAM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; background: #111; color: #eee; font-family: sans-serif; }
  h1 { font-size: 1.1rem; margin: 0; padding: .6rem 1rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(480px, 1fr)); gap: .5rem; padding: .5rem; }
  .tile { background: #000; border: 1px solid #333; border-radius: 4px; }
  .bar { display: flex; justify-content: space-between; padding: .3rem .6rem; font-size: .9rem; }
  .badge { padding: 0 .5rem; border-radius: 3px; background: #a33; }
  .badge.live { background: #2a7; }
  video { width: 100%; aspect-ratio: 4 / 3; background: #000; display: block; }
</style>
</head>
<body>
<h1>PYCAM</h1>
<div class="grid">
{{range .}}
  <div class="tile">
    <div class="bar"><span>{{.Name}} <small>({{.Addr}})</small></span><span class="badge" id="badge-{{.ID}}">offline</span></div>
    <video muted autoplay playsinline data-ws="{{.WS}}" data-badge="badge-{{.ID}}"></video>
  </div>
{{end}}
</div>
<script src="/static/player.js"></script>
</body>
</html>
